name: hey_overlay
description: "Hey Notes' over-other-apps listening overlay: glowing screen edges and a status bubble (Android)."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.wisdomose.hey_overlay
        pluginClass: HeyOverlayPlugin
