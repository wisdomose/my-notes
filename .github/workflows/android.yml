# Builds the Hey Notes APK. Free on public repos (standard runner).
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
          cache: true

      - name: Cache speech models
        uses: actions/cache@v6
        with:
          path: apps/mobile/assets/models
          key: models-${{ hashFiles('apps/mobile/scripts/fetch-models.sh') }}

      - name: Cache Gradle
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}

      - run: pnpm install --frozen-lockfile

      - name: Lint, test and build
        run: pnpm turbo run lint test build

      - uses: actions/upload-artifact@v7
        with:
          name: hey-notes-apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
